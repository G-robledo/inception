server {
    listen 443 ssl http2;
    server_name ${DOMAIN_NAME};

    ssl_certificate /data/nginx/ssl/server.crt;
    ssl_certificate_key /data/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params_inception;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST ${DOMAIN_NAME}:${HTTPS_PORT};
        fastcgi_param SERVER_PORT ${HTTPS_PORT};
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ /\. {
        deny all;
    }
}
