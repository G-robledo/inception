version: '3.3'

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    restart: always  # Redémarre automatiquement en cas de cras
    env_file:
      - ./../secrets/.env
      - .env  # Permet d'utiliser un fichier .env pour les variables sensibles
    volumes:
      - /home/greg/data/mariadb:/var/lib/mysql  # Bind mount au lieu d un volume Docker
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    restart: always
    depends_on:
      - mariadb  # Assure que MariaDB est lancé avant WordPres
    env_file:
      - ./../secrets/.env
      - .env
    volumes:
      - /home/greg/data/wordpress:/var/www/html  # Bind mount pour WordPress
    networks:
      - inception

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    restart: always
    depends_on:
      - wordpress  # Assure que WordPress est lancé avant Nginx
    ports:
      - "443:443"  # Expose Nginx en HTTPS
    volumes:
      - /home/greg/data/wordpress:/var/www/html  # Bind mount pour WordPress
      - /home/greg/data/nginx/ssl:/data/nginx/ssl  # Volume pour les certificats SSL
    networks:
      - inception

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/greg/data/wordpress
      o: bind
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/greg/data/mariadb
      o: bind

networks:
  inception:
    driver: bridge